name: Auto Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: autocloud-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy AutoCloud
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy to MilesWeb VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          command_timeout: 15m

          script: |
            set -eu

            echo "Starting AutoCloud deployment..."

            cd /root/AutoCloud

            # Load NVM if Node.js is managed through NVM
            export NVM_DIR="/root/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            fi

            # Verify required tools
            echo "Node: $(node -v)"
            echo "NPM: $(npm -v)"
            command -v pm2

            # Fetch and fast-forward to the latest main commit
            git fetch origin main
            git pull --ff-only origin main

            echo "Installing dependencies..."
            npm ci

            echo "Building production application..."
            npm run build

            echo "Restarting AutoCloud..."
            pm2 restart autocloud --update-env

            echo "Checking PM2 status..."
            pm2 status autocloud

            echo "Deployment commands completed."