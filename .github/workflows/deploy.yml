name: Auto Deploy to VPS

on:
  push:
    branches:
      - main  # जब भी main ब्रांच में कोड पुश होगा, ये रन करेगा

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Connecting to Server and Deploying
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }} 
          # 👆 यहाँ हमने key हटाकर password सेट कर दिया है
          
          script: |
            # 1. अपने प्रोजेक्ट फोल्डर में जाएँ (इसे अपने असली पाथ से बदलें)
            cd /path/to/your/project
            
            # 2. नया कोड GitHub से पुल करें
            git pull origin main
            
            # 3. ऐप को रीस्टार्ट करें (नीचे के कमांड्स अपनी ऐप के हिसाब से रखें)
            npm install
            npm run build
            pm2 restart all